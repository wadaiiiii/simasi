<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SIMASI FMIPA Universitas Sulawesi Barat</title>
  <desc id="desc">Sistem Informasi Manajemen Kuliah dan Skripsi</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2747"/>
      <stop offset="0.58" stop-color="#2636b7"/>
      <stop offset="1" stop-color="#4d1daf"/>
    </linearGradient>
    <linearGradient id="pill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4576d"/>
      <stop offset="1" stop-color="#8e2cb0"/>
    </linearGradient>
    <linearGradient id="pill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00cfe1"/>
      <stop offset="1" stop-color="#182e79"/>
    </linearGradient>
    <linearGradient id="pill3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#416cff"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <radialGradient id="glow1">
      <stop offset="0" stop-color="#00cfe1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00cfe1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2">
      <stop offset="0" stop-color="#f4576d" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#f4576d" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#08172c" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1085" cy="90" r="270" fill="url(#glow1)"/>
  <circle cx="35" cy="610" r="280" fill="url(#glow2)"/>

  <rect x="64" y="54" width="1072" height="522" rx="42" fill="#ffffff" fill-opacity="0.075" stroke="#ffffff" stroke-opacity="0.16" filter="url(#shadow)"/>

  <rect x="102" y="92" width="370" height="58" rx="29" fill="#ffffff"/>
  <text x="127" y="130" fill="#182e79" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="1.1">PORTAL AKADEMIK FMIPA</text>

  <text x="100" y="260" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800">SIMASI</text>
  <text x="104" y="350" fill="#f7f9ff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Sistem Informasi Manajemen</text>
  <text x="104" y="405" fill="#f7f9ff" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Kuliah &amp; Skripsi</text>
  <text x="104" y="500" fill="#d7e2f7" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="1.2">FMIPA • UNIVERSITAS SULAWESI BARAT</text>

  <g transform="translate(905 190)">
    <rect x="0" y="0" width="62" height="200" rx="31" fill="url(#pill1)"/>
    <rect x="78" y="55" width="62" height="200" rx="31" fill="url(#pill2)"/>
    <rect x="156" y="110" width="62" height="200" rx="31" fill="url(#pill3)"/>
  </g>
</svg>
