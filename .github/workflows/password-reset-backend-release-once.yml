name: SIMASI Password Reset Backend Release

on:
  push:
    branches: [main]
    paths:
      - 'deploy/password-reset-backend-trigger.txt'

permissions:
  contents: read

concurrency:
  group: simasi-password-reset-backend
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: jdptpfpmelmaviucaioq
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate token
        run: test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
      - name: Install Supabase CLI
        run: npm install --global supabase@latest
      - name: Apply password reset migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          sql = Path('supabase/password_reset_requests.sql').read_text()
          Path('/tmp/password-reset-query.json').write_text(json.dumps({'query': sql, 'read_only': False}))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/password-reset-query.json
      - name: Deploy public reset request function
        run: supabase functions deploy request-password-reset --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Deploy protected reset management function
        run: supabase functions deploy manage-password-reset --project-ref "$SUPABASE_PROJECT_REF"
      - name: Verify deployed functions
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
