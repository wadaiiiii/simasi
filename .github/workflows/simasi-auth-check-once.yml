name: SIMASI Auth Status Check (One Shot)

on:
  push:
    branches: [main]
    paths:
      - 'deploy/auth-check-trigger.txt'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: jdptpfpmelmaviucaioq
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Query auth counts safely
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          python3 - <<'PY'
          import json
          q = "select (select count(*) from auth.users) as auth_users, (select count(*) from public.profiles) as profiles, (select count(*) from public.profiles where role='admin') as admins, (select count(*) from public.mahasiswa) as mahasiswa"
          open('/tmp/q.json','w').write(json.dumps({'query': q, 'read_only': True}))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/q.json > /tmp/result.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/result.json'))
          row=(data or [{}])[0]
          for k in ('auth_users','profiles','admins','mahasiswa'):
              print(f'{k}={row.get(k,0)}')
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### SIMASI Auth status\n')
              f.write(f"- Auth users: {row.get('auth_users',0)}\n")
              f.write(f"- Profiles: {row.get('profiles',0)}\n")
              f.write(f"- Admins: {row.get('admins',0)}\n")
              f.write(f"- Mahasiswa: {row.get('mahasiswa',0)}\n")
          PY
