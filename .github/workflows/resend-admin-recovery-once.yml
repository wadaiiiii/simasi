name: Resend FMIPA Admin Recovery (One Shot)

on:
  push:
    branches: [main]
    paths:
      - 'deploy/resend-admin-recovery-trigger.txt'

permissions:
  contents: read

jobs:
  resend:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: jdptpfpmelmaviucaioq
      SUPABASE_URL: https://jdptpfpmelmaviucaioq.supabase.co
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SITE_URL: https://simasimipa.vercel.app
      ADMIN_EMAIL: fmipa@unsulbar.ac.id
    steps:
      - name: Validate token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }

      - name: Resolve frontend-safe Supabase key
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/api-keys?reveal=true" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" >/tmp/api-keys.json
          KEY=$(jq -r '[.[] | select(.type=="publishable") | .api_key][0] // [.[] | select(.name=="anon" or .type=="anon") | .api_key][0] // empty' /tmp/api-keys.json)
          test -n "$KEY" || { echo 'No frontend-safe Supabase API key found'; exit 1; }
          echo "::add-mask::$KEY"
          echo "SUPABASE_PUBLIC_KEY=$KEY" >> "$GITHUB_ENV"
          rm -f /tmp/api-keys.json

      - name: Send fresh recovery email
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg email "$ADMIN_EMAIL" '{email:$email}' >/tmp/recover.json
          HTTP=$(curl --silent --show-error -o /tmp/recover-response.json -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/auth/v1/recover?redirect_to=${SITE_URL}" \
            -H "apikey: ${SUPABASE_PUBLIC_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLIC_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/recover.json)
          echo "Recovery API: HTTP ${HTTP}"
          if [ "$HTTP" != "200" ]; then
            echo "Message: $(jq -r '.msg // .message // .error_description // "unknown error"' /tmp/recover-response.json)"
            exit 1
          fi
          echo '### FMIPA admin recovery' >> "$GITHUB_STEP_SUMMARY"
          echo '- Fresh password recovery email requested successfully' >> "$GITHUB_STEP_SUMMARY"
          echo '- Redirect: https://simasimipa.vercel.app' >> "$GITHUB_STEP_SUMMARY"
