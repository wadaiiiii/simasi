name: SIMASI Session Refresh Patch

on:
  push:
    branches: [main]
    paths:
      - 'deploy/session-refresh-patch-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply session refresh patch
        run: python3 scripts/patch-session-refresh.py
      - name: Syntax checks
        run: |
          node --check src/app-v5.js
          node --check src/v4/core.js
          node --check src/v5/runtime-fixes.js
      - name: Commit patch
        run: |
          git config user.name 'SIMASI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app-v5.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: preserve active session across page refresh'
          git push origin main
