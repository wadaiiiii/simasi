name: SIMASI No Email Password UI Patch

on:
  push:
    branches: [main]
    paths:
      - 'deploy/password-no-email-ui-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply password flow patch
        run: python3 scripts/patch-no-email-password-flow.py

      - name: Syntax check
        run: |
          node --check src/app-v5.js
          node --check src/v4/data.js

      - name: Trigger one Vercel production release
        shell: bash
        run: |
          cat > deploy/vercel-production-trigger.txt <<'EOF'
          Controlled SIMASI Vercel production checkpoint
          Canonical domain: https://simasimipa.vercel.app
          Frontend: no-email password creation/reset flow
          Deployment path: Vercel REST API from built dist + canonical alias assignment
          Triggered: 2026-09-08T02:52:00+08:00
          Reason: reset credentials are shown once in admin; no password email is sent
          EOF

      - name: Commit application patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SIMASI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app-v5.js src/v4/data.js deploy/vercel-production-trigger.txt
          git commit -m 'feat: reset passwords locally without email'
          git push origin main
