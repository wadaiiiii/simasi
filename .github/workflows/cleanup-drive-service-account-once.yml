name: Cleanup Legacy Drive Service Account (One Shot)

on:
  push:
    branches: [main]
    paths:
      - 'deploy/cleanup-drive-service-account-trigger.txt'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: jdptpfpmelmaviucaioq
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Install Supabase CLI
        run: npm install --global supabase@latest
      - name: Remove legacy service-account secrets from Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets unset GOOGLE_SERVICE_ACCOUNT_EMAIL GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY --project-ref "$SUPABASE_PROJECT_REF" || true
      - name: Summary
        run: echo 'Legacy Google Drive service-account secrets removed from Supabase runtime.' >> "$GITHUB_STEP_SUMMARY"
