name: SIMASI Academic Info Visibility Audit

on:
  push:
    branches: [main]
    paths:
      - 'deploy/audit-announcements-trigger.txt'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: jdptpfpmelmaviucaioq
      SUPABASE_URL: https://jdptpfpmelmaviucaioq.supabase.co
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve API keys
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys?reveal=true" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" >/tmp/keys.json
          PUBLISHABLE=$(jq -r '[.[] | select(.type=="publishable") | .api_key][0] // empty' /tmp/keys.json)
          SERVICE=$(jq -r '[.[] | select(.name=="service_role") | .api_key][0] // empty' /tmp/keys.json)
          test -n "$PUBLISHABLE" && test -n "$SERVICE"
          echo "::add-mask::$PUBLISHABLE"; echo "::add-mask::$SERVICE"
          echo "PUBLISHABLE=$PUBLISHABLE" >> "$GITHUB_ENV"
          echo "SERVICE=$SERVICE" >> "$GITHUB_ENV"
      - name: Compare service and frontend-public visibility
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error "$SUPABASE_URL/rest/v1/pengumuman?select=id,judul,tanggal,is_active,created_at&order=created_at.desc" \
            -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" >/tmp/all.json
          curl --silent --show-error -D /tmp/pub.headers "$SUPABASE_URL/rest/v1/pengumuman?select=id,judul,tanggal,is_active,created_at&is_active=eq.true&order=tanggal.desc" \
            -H "apikey: $PUBLISHABLE" -H "Authorization: Bearer $PUBLISHABLE" >/tmp/pub.json
          ALL_COUNT=$(jq 'if type=="array" then length else 0 end' /tmp/all.json)
          ACTIVE_COUNT=$(jq '[.[] | select(.is_active==true)] | length' /tmp/all.json 2>/dev/null || echo 0)
          PUB_COUNT=$(jq 'if type=="array" then length else 0 end' /tmp/pub.json)
          PUB_HTTP=$(awk 'NR==1{print $2}' /tmp/pub.headers)
          echo "SERVICE_TOTAL=$ALL_COUNT ACTIVE_TOTAL=$ACTIVE_COUNT PUBLISHABLE_HTTP=$PUB_HTTP PUBLISHABLE_TOTAL=$PUB_COUNT"
          echo "### Academic Info Frontend Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- total_service_visible: $ALL_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "- active_service_visible: $ACTIVE_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "- frontend_publishable_http: $PUB_HTTP" >> "$GITHUB_STEP_SUMMARY"
          echo "- frontend_active_visible: $PUB_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "- frontend_body: $(jq -c 'if type==\"array\" then map({judul,tanggal,is_active}) else . end' /tmp/pub.json)" >> "$GITHUB_STEP_SUMMARY"
          test "$PUB_HTTP" = "200"
          test "$PUB_COUNT" -eq "$ACTIVE_COUNT"
