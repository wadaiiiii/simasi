name: SIMASI Academic Info Visibility Audit

on:
  push:
    branches: [main]
    paths:
      - 'deploy/audit-announcements-trigger.txt'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: jdptpfpmelmaviucaioq
      SUPABASE_URL: https://jdptpfpmelmaviucaioq.supabase.co
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve API keys
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys?reveal=true" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" >/tmp/keys.json
          PUBLISHABLE=$(jq -r '[.[] | select(.type=="publishable") | .api_key][0] // empty' /tmp/keys.json)
          LEGACY_ANON=$(jq -r '[.[] | select(.name=="anon" or .type=="anon") | .api_key][0] // empty' /tmp/keys.json)
          SERVICE=$(jq -r '[.[] | select(.name=="service_role") | .api_key][0] // empty' /tmp/keys.json)
          test -n "$PUBLISHABLE" && test -n "$LEGACY_ANON" && test -n "$SERVICE"
          for x in "$PUBLISHABLE" "$LEGACY_ANON" "$SERVICE"; do echo "::add-mask::$x"; done
          echo "PUBLISHABLE=$PUBLISHABLE" >> "$GITHUB_ENV"
          echo "LEGACY_ANON=$LEGACY_ANON" >> "$GITHUB_ENV"
          echo "SERVICE=$SERVICE" >> "$GITHUB_ENV"
      - name: Compare frontend key modes
        shell: bash
        run: |
          set -euo pipefail
          URL="$SUPABASE_URL/rest/v1/pengumuman?select=id,judul,tanggal,is_active&is_active=eq.true&order=tanggal.desc"
          curl --silent --show-error "$SUPABASE_URL/rest/v1/pengumuman?select=id,judul,tanggal,is_active&order=created_at.desc" -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" >/tmp/all.json
          ACTIVE_COUNT=$(jq '[.[] | select(.is_active==true)] | length' /tmp/all.json)

          PUB_HTTP=$(curl --silent --show-error -o /tmp/pub.json -w '%{http_code}' "$URL" -H "apikey: $PUBLISHABLE")
          ANON_HTTP=$(curl --silent --show-error -o /tmp/anon.json -w '%{http_code}' "$URL" -H "apikey: $LEGACY_ANON" -H "Authorization: Bearer $LEGACY_ANON")
          PUB_COUNT=$(jq 'if type=="array" then length else 0 end' /tmp/pub.json)
          ANON_COUNT=$(jq 'if type=="array" then length else 0 end' /tmp/anon.json)
          echo "ACTIVE=$ACTIVE_COUNT PUBLISHABLE_HTTP=$PUB_HTTP PUBLISHABLE_COUNT=$PUB_COUNT LEGACY_HTTP=$ANON_HTTP LEGACY_COUNT=$ANON_COUNT"
          echo "Publishable body: $(cat /tmp/pub.json)"
          echo "Legacy body: $(cat /tmp/anon.json)"
          echo "### Academic Info Key Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- active_service: $ACTIVE_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "- publishable: HTTP $PUB_HTTP / $PUB_COUNT rows" >> "$GITHUB_STEP_SUMMARY"
          echo "- legacy anon: HTTP $ANON_HTTP / $ANON_COUNT rows" >> "$GITHUB_STEP_SUMMARY"
          test "$ANON_HTTP" = "200"
          test "$ANON_COUNT" -eq "$ACTIVE_COUNT"
