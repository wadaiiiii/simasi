name: SIMASI Password Reset UI Patch

on:
  push:
    branches: [main]
    paths:
      - 'deploy/password-reset-ui-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply password reset UI patch
        run: python3 scripts/patch-password-reset-ui.py
      - name: Syntax checks
        run: |
          node --check src/app-v5.js
          node --check src/v4/landing-simple.js
          node --check src/v5/views.js
          node --check src/v5/password-reset.js
      - name: Commit patch
        run: |
          git config user.name 'SIMASI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app-v5.js src/v4/landing-simple.js src/v5/views.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add password reset request interface'
          git push origin main
