name: Supabase Backend Release (One Shot)

on:
  push:
    branches: [main]
    paths:
      - 'deploy/supabase-release-trigger.txt'

permissions:
  contents: read

concurrency:
  group: simasi-supabase-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_PROJECT_REF: jdptpfpmelmaviucaioq
      GOOGLE_DRIVE_ROOT_FOLDER_ID: 19Pi-nie5ODUBDeoPcnEMGVu-wkiPDwrv
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}" || { echo 'Missing GOOGLE_SERVICE_ACCOUNT_EMAIL'; exit 1; }
          test -n "${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY:-}" || { echo 'Missing GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY'; exit 1; }

      - name: Install Supabase CLI
        run: npm install --global supabase@latest

      - name: Apply SIMASI database migration via Management API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          sql = Path('supabase/student_import_drive.sql').read_text()
          Path('/tmp/simasi-query.json').write_text(json.dumps({'query': sql, 'read_only': False}))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/simasi-query.json

      - name: Verify Google Drive service account access
        run: node scripts/verify-google-drive-service-account.mjs

      - name: Configure Google Drive secrets in Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            GOOGLE_DRIVE_ROOT_FOLDER_ID="$GOOGLE_DRIVE_ROOT_FOLDER_ID" \
            GOOGLE_SERVICE_ACCOUNT_EMAIL="$GOOGLE_SERVICE_ACCOUNT_EMAIL" \
            GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY="$GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY"

      - name: Deploy import-mahasiswa
        run: supabase functions deploy import-mahasiswa --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy change-initial-password
        run: supabase functions deploy change-initial-password --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy upload-seminar-drive
        run: supabase functions deploy upload-seminar-drive --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify deployed Edge Functions
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"

      - name: Summary
        run: |
          echo '### SIMASI backend release' >> "$GITHUB_STEP_SUMMARY"
          echo '- Database migration: applied through Supabase Management API' >> "$GITHUB_STEP_SUMMARY"
          echo '- Google Drive: service account verified' >> "$GITHUB_STEP_SUMMARY"
          echo '- Seminar upload: PDF only, max 2 MB' >> "$GITHUB_STEP_SUMMARY"
          echo '- Edge Functions: import-mahasiswa, change-initial-password, upload-seminar-drive' >> "$GITHUB_STEP_SUMMARY"
