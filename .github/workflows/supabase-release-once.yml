name: Supabase Backend Release (One Shot)

on:
  push:
    branches: [main]
    paths:
      - 'deploy/supabase-release-trigger.txt'

permissions:
  contents: read

concurrency:
  group: simasi-supabase-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_PROJECT_REF: jdptpfpmelmaviucaioq
      GOOGLE_DRIVE_ROOT_FOLDER_ID: 19Pi-nie5ODUBDeoPcnEMGVu-wkiPDwrv
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "${GOOGLE_OAUTH_CLIENT_ID:-}" || { echo 'Missing GOOGLE_OAUTH_CLIENT_ID'; exit 1; }
          test -n "${GOOGLE_OAUTH_CLIENT_SECRET:-}" || { echo 'Missing GOOGLE_OAUTH_CLIENT_SECRET'; exit 1; }
          test -n "${GOOGLE_OAUTH_REFRESH_TOKEN:-}" || { echo 'Missing GOOGLE_OAUTH_REFRESH_TOKEN'; exit 1; }

      - name: Install Supabase CLI
        run: npm install --global supabase@latest

      - name: Apply SIMASI database migrations via Management API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          sql = "\n\n".join([
              Path('supabase/student_import_drive.sql').read_text(),
              Path('supabase/admin_portal.sql').read_text(),
              Path('supabase/seminar_lifecycle.sql').read_text(),
              Path('supabase/staff_prodi_scope.sql').read_text(),
          ])
          Path('/tmp/simasi-query.json').write_text(json.dumps({'query': sql, 'read_only': False}))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/simasi-query.json

      - name: Verify FMIPA Google Drive OAuth access
        run: node scripts/verify-google-drive-oauth.mjs

      - name: Configure Google Drive OAuth secrets in Supabase
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            GOOGLE_DRIVE_ROOT_FOLDER_ID="$GOOGLE_DRIVE_ROOT_FOLDER_ID" \
            GOOGLE_OAUTH_CLIENT_ID="$GOOGLE_OAUTH_CLIENT_ID" \
            GOOGLE_OAUTH_CLIENT_SECRET="$GOOGLE_OAUTH_CLIENT_SECRET" \
            GOOGLE_OAUTH_REFRESH_TOKEN="$GOOGLE_OAUTH_REFRESH_TOKEN"

      - name: Deploy import-mahasiswa
        run: supabase functions deploy import-mahasiswa --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy admin-users
        run: supabase functions deploy admin-users --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy admin-seminar
        run: supabase functions deploy admin-seminar --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy change-initial-password
        run: supabase functions deploy change-initial-password --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy upload-seminar-drive
        run: supabase functions deploy upload-seminar-drive --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy preview-seminar-drive
        run: supabase functions deploy preview-seminar-drive --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify deployed Edge Functions
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"

      - name: Summary
        run: |
          echo '### SIMASI backend release' >> "$GITHUB_STEP_SUMMARY"
          echo '- Database lifecycle: applied through Supabase Management API' >> "$GITHUB_STEP_SUMMARY"
          echo '- Staff scope: Staff hanya dapat mengelola pengajuan dari profile.prodi yang sama' >> "$GITHUB_STEP_SUMMARY"
          echo '- Admin scope: administrator tetap dapat mengelola seluruh program studi' >> "$GITHUB_STEP_SUMMARY"
          echo '- Google Drive: FMIPA OAuth verified against configured SIMASI folder' >> "$GITHUB_STEP_SUMMARY"
          echo '- Seminar upload: PDF only, max 2 MB, metadata persisted by trusted Edge Function' >> "$GITHUB_STEP_SUMMARY"
          echo '- Secure preview: mahasiswa pemilik, admin, atau Staff pada Prodi yang sama' >> "$GITHUB_STEP_SUMMARY"
          echo '- Admin deletion: pengajuan + file Drive dapat dibersihkan oleh admin' >> "$GITHUB_STEP_SUMMARY"
          echo '- Lifecycle: diajukan → diverifikasi/perbaikan → lengkap' >> "$GITHUB_STEP_SUMMARY"
          echo '- Edge Functions: import-mahasiswa, admin-users, admin-seminar, change-initial-password, upload-seminar-drive, preview-seminar-drive' >> "$GITHUB_STEP_SUMMARY"
