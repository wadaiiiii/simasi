name: Vercel Promote - Manual

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "URL preview Vercel yang sudah lolos QA"
        required: true

concurrency:
  group: simasi-vercel-manual-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Promote existing preview to production
        shell: bash
        run: |
          vercel promote "${{ inputs.deployment_url }}" --token="${{ secrets.VERCEL_TOKEN }}"
          echo "### SIMASI promoted to production" >> "$GITHUB_STEP_SUMMARY"
          echo "Source preview: ${{ inputs.deployment_url }}" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
