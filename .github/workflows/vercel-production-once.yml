name: Vercel Production Release (One Shot)

on:
  push:
    branches: [main]
    paths:
      - 'deploy/vercel-production-trigger.txt'

permissions:
  contents: read

concurrency:
  group: simasi-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: jdptpfpmelmaviucaioq
      SUPABASE_URL: https://jdptpfpmelmaviucaioq.supabase.co
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_4IWej07Hjmsjc6KzX0ZSLW4Q
      CANONICAL_DOMAIN: simasimipa.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "${VERCEL_TOKEN:-}" || { echo 'Missing VERCEL_TOKEN'; exit 1; }

      - name: Resolve Vercel project by canonical domain
        shell: bash
        run: |
          set -euo pipefail
          HTTP=$(curl --silent --show-error -o /tmp/projects.json -w '%{http_code}' \
            "https://api.vercel.com/v9/projects?teamId=${VERCEL_ORG_ID}&limit=100" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")
          echo "Vercel projects API: HTTP ${HTTP}"
          if [ "$HTTP" != "200" ]; then
            echo "Vercel API message: $(jq -r '.error.message // .message // "unknown error"' /tmp/projects.json)"
            exit 1
          fi

          PROJECT_ID=""
          PROJECT_NAME=""
          for ID in $(jq -r '.projects[]?.id' /tmp/projects.json); do
            NAME=$(jq -r --arg id "$ID" '.projects[] | select(.id==$id) | .name' /tmp/projects.json)
            DOM_HTTP=$(curl --silent --show-error -o /tmp/domains.json -w '%{http_code}' \
              "https://api.vercel.com/v9/projects/${ID}/domains?teamId=${VERCEL_ORG_ID}&limit=100" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}")
            if [ "$DOM_HTTP" = "200" ] && jq -e --arg d "$CANONICAL_DOMAIN" '.domains[]? | select(.name==$d)' /tmp/domains.json >/dev/null; then
              PROJECT_ID="$ID"
              PROJECT_NAME="$NAME"
              break
            fi
          done

          if [ -z "$PROJECT_ID" ]; then
            PROJECT_ID=$(jq -r '[.projects[] | select(.name=="simasi" or .name=="simasimipa")][0].id // empty' /tmp/projects.json)
            PROJECT_NAME=$(jq -r --arg id "$PROJECT_ID" '.projects[]? | select(.id==$id) | .name' /tmp/projects.json)
          fi
          test -n "$PROJECT_ID" || {
            echo 'Project dengan domain simasimipa.vercel.app tidak ditemukan pada team ini.'
            echo "Project terlihat: $(jq -r '[.projects[]?.name] | join(", ")' /tmp/projects.json)"
            exit 1
          }
          echo "VERCEL_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"
          echo "Resolved Vercel project: $PROJECT_NAME ($PROJECT_ID)"
          rm -f /tmp/projects.json /tmp/domains.json

      - name: Resolve Supabase publishable key securely
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/api-keys?reveal=true" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" >/tmp/api-keys.json
          KEY=$(jq -r '[.[] | select(.type=="publishable") | .api_key][0] // [.[] | select(.name=="anon" or .type=="anon") | .api_key][0] // empty' /tmp/api-keys.json)
          test -n "$KEY" || { echo 'No frontend-safe Supabase API key found'; exit 1; }
          echo "::add-mask::$KEY"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$KEY" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=$SUPABASE_URL" >> "$GITHUB_ENV"
          rm -f /tmp/api-keys.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Syntax check focused frontend
        run: |
          node --check src/app-v5.js
          node --check src/v4/core.js
          node --check src/v4/landing-simple.js
          node --check src/v4/views.js
          node --check src/v4/data.js
          node --check src/supabase.js

      - name: Build static production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Prepare Vercel deployment payload
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const root = path.resolve('dist')
          const files = []
          const walk = (dir) => {
            for (const name of fs.readdirSync(dir)) {
              const full = path.join(dir, name)
              const stat = fs.statSync(full)
              if (stat.isDirectory()) walk(full)
              else files.push({
                file: path.relative(root, full).split(path.sep).join('/'),
                data: fs.readFileSync(full).toString('base64'),
                encoding: 'base64'
              })
            }
          }
          walk(root)
          if (!files.length) throw new Error('dist kosong')
          const body = {
            name: process.env.VERCEL_PROJECT_NAME || 'simasi',
            project: process.env.VERCEL_PROJECT_ID,
            target: 'production',
            files,
            gitMetadata: {
              remoteUrl: 'https://github.com/wadaiiiii/simasi',
              commitMessage: process.env.GITHUB_EVENT_HEAD_COMMIT_MESSAGE || 'SIMASI production release',
              commitRef: 'main',
              commitSha: process.env.GITHUB_SHA,
              dirty: false,
              ci: true,
              ciType: 'github-actions',
              ciGitRepoVisibility: 'public',
              rootDirectory: ''
            }
          }
          fs.writeFileSync('/tmp/vercel-deploy.json', JSON.stringify(body))
          console.log(`Prepared ${files.length} files for Vercel REST deployment.`)
          NODE

      - name: Create one production deployment via REST API
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          HTTP=$(curl --silent --show-error -o /tmp/deployment.json -w '%{http_code}' \
            -X POST "https://api.vercel.com/v13/deployments?teamId=${VERCEL_ORG_ID}&forceNew=1&skipAutoDetectionConfirmation=1" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/vercel-deploy.json)
          echo "Create deployment API: HTTP ${HTTP}"
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "Vercel deployment error: $(jq -r '.error.message // .message // "unknown error"' /tmp/deployment.json)"
            exit 1
          fi
          DEPLOYMENT_ID=$(jq -r '.id // empty' /tmp/deployment.json)
          DEPLOYMENT_URL=$(jq -r '.url // empty' /tmp/deployment.json)
          test -n "$DEPLOYMENT_ID" || { echo 'Deployment ID tidak tersedia'; exit 1; }
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Created deployment: $DEPLOYMENT_ID"
          echo "Created URL: https://$DEPLOYMENT_URL"

      - name: Wait until deployment ready
        shell: bash
        run: |
          set -euo pipefail
          ID='${{ steps.deploy.outputs.deployment_id }}'
          for i in $(seq 1 30); do
            HTTP=$(curl --silent --show-error -o /tmp/deployment-status.json -w '%{http_code}' \
              "https://api.vercel.com/v13/deployments/${ID}?teamId=${VERCEL_ORG_ID}" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}")
            test "$HTTP" = "200" || { echo "Status API HTTP $HTTP"; exit 1; }
            STATE=$(jq -r '.readyState // .state // "UNKNOWN"' /tmp/deployment-status.json)
            echo "Deployment state: $STATE"
            if [ "$STATE" = "READY" ]; then
              exit 0
            fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              echo "Deployment gagal dengan state $STATE"
              exit 1
            fi
            sleep 4
          done
          echo 'Timeout menunggu deployment READY'
          exit 1

      - name: Assign canonical alias to latest deployment
        shell: bash
        run: |
          set -euo pipefail
          ID='${{ steps.deploy.outputs.deployment_id }}'
          HTTP=$(curl --silent --show-error -o /tmp/alias.json -w '%{http_code}' \
            -X POST "https://api.vercel.com/v2/deployments/${ID}/aliases?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "{\"alias\":\"${CANONICAL_DOMAIN}\",\"redirect\":null}")
          echo "Assign alias API: HTTP ${HTTP}"
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "Alias error: $(jq -r '.error.message // .message // "unknown error"' /tmp/alias.json)"
            cat /tmp/alias.json
            exit 1
          fi
          echo "Alias assigned: ${CANONICAL_DOMAIN} -> ${ID}"

      - name: Verify canonical alias and content
        shell: bash
        run: |
          set -euo pipefail
          ID='${{ steps.deploy.outputs.deployment_id }}'
          URL='${{ steps.deploy.outputs.deployment_url }}'

          HTTP=$(curl --silent --show-error -o /tmp/alias-check.json -w '%{http_code}' \
            "https://api.vercel.com/v4/aliases/${CANONICAL_DOMAIN}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}")
          echo "Alias verify API: HTTP ${HTTP}"
          test "$HTTP" = "200" || { cat /tmp/alias-check.json; exit 1; }
          ALIAS_DEPLOYMENT=$(jq -r '.deploymentId // .deployment.id // empty' /tmp/alias-check.json)
          if [ -n "$ALIAS_DEPLOYMENT" ] && [ "$ALIAS_DEPLOYMENT" != "$ID" ]; then
            echo "Alias masih menunjuk deployment lain: $ALIAS_DEPLOYMENT"
            exit 1
          fi

          sleep 2
          curl --fail --silent --show-error "https://${CANONICAL_DOMAIN}/?release=${GITHUB_SHA}" -o /tmp/canonical.html
          curl --fail --silent --show-error "https://${URL}/?release=${GITHUB_SHA}" -o /tmp/deployment.html
          grep -q 'SIMASI' /tmp/canonical.html || { echo 'Canonical page tidak memuat SIMASI'; exit 1; }
          echo "Canonical SHA256: $(sha256sum /tmp/canonical.html | cut -d' ' -f1)"
          echo "Deployment SHA256: $(sha256sum /tmp/deployment.html | cut -d' ' -f1)"

          echo '### SIMASI production release' >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: $VERCEL_PROJECT_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: https://$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical: https://${CANONICAL_DOMAIN}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Alias verified to deployment: $ID" >> "$GITHUB_STEP_SUMMARY"
