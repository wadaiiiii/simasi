name: SIMASI Staff Temporary Password UI Patch

on:
  push:
    branches: [main]
    paths:
      - 'deploy/staff-temp-password-ui-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch staff credential UI
        run: python3 scripts/patch-staff-temp-password-ui.py

      - name: Syntax check
        run: node --check src/app-v5.js

      - name: Commit UI patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SIMASI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app-v5.js
          git commit -m 'feat: show one-time staff temporary password'
          git push origin main
