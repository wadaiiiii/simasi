name: Supabase Backend Release (Manual)

on:
  workflow_dispatch:
    inputs:
      apply_database:
        description: "Apply student import / Drive database migration"
        required: true
        type: boolean
        default: true
      configure_google_drive:
        description: "Push FMIPA Google Drive OAuth credentials to Supabase"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: simasi-supabase-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_PROJECT_REF: jdptpfpmelmaviucaioq
      GOOGLE_DRIVE_ROOT_FOLDER_ID: 19Pi-nie5ODUBDeoPcnEMGVu-wkiPDwrv
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          if [[ "${{ inputs.configure_google_drive }}" == "true" ]]; then
            test -n "${GOOGLE_OAUTH_CLIENT_ID:-}" || { echo "Missing GOOGLE_OAUTH_CLIENT_ID"; exit 1; }
            test -n "${GOOGLE_OAUTH_CLIENT_SECRET:-}" || { echo "Missing GOOGLE_OAUTH_CLIENT_SECRET"; exit 1; }
            test -n "${GOOGLE_OAUTH_REFRESH_TOKEN:-}" || { echo "Missing GOOGLE_OAUTH_REFRESH_TOKEN"; exit 1; }
          fi

      - name: Install Supabase CLI
        run: npm install --global supabase@latest

      - name: Apply database migration via Management API
        if: ${{ inputs.apply_database }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          sql = Path('supabase/student_import_drive.sql').read_text()
          Path('/tmp/simasi-query.json').write_text(json.dumps({'query': sql, 'read_only': False}))
          PY
          curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/simasi-query.json

      - name: Verify FMIPA Google Drive OAuth permission
        if: ${{ inputs.configure_google_drive }}
        run: node scripts/verify-google-drive-oauth.mjs

      - name: Configure FMIPA Google Drive OAuth
        if: ${{ inputs.configure_google_drive }}
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            GOOGLE_DRIVE_ROOT_FOLDER_ID="$GOOGLE_DRIVE_ROOT_FOLDER_ID" \
            GOOGLE_OAUTH_CLIENT_ID="$GOOGLE_OAUTH_CLIENT_ID" \
            GOOGLE_OAUTH_CLIENT_SECRET="$GOOGLE_OAUTH_CLIENT_SECRET" \
            GOOGLE_OAUTH_REFRESH_TOKEN="$GOOGLE_OAUTH_REFRESH_TOKEN"

      - name: Deploy import-mahasiswa
        run: supabase functions deploy import-mahasiswa --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy change-initial-password
        run: supabase functions deploy change-initial-password --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy upload-seminar-drive
        run: supabase functions deploy upload-seminar-drive --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify deployed Edge Functions
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"

      - name: Release summary
        run: |
          echo "### SIMASI Supabase release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: $SUPABASE_PROJECT_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database script: ${{ inputs.apply_database }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Google Drive OAuth configured: ${{ inputs.configure_google_drive }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Functions: import-mahasiswa, change-initial-password, upload-seminar-drive" >> "$GITHUB_STEP_SUMMARY"
          echo "- Seminar uploads: PDF only, max 2 MB" >> "$GITHUB_STEP_SUMMARY"
          echo "- Drive root: $GOOGLE_DRIVE_ROOT_FOLDER_ID" >> "$GITHUB_STEP_SUMMARY"
