name: SIMASI Admin Portal Backend Release (One Shot)

on:
  push:
    branches: [main]
    paths:
      - 'deploy/admin-portal-release-trigger.txt'

permissions:
  contents: read

concurrency:
  group: simasi-admin-portal-backend
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: jdptpfpmelmaviucaioq
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate token
        run: test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
      - name: Install Supabase CLI
        run: npm install --global supabase@latest
      - name: Apply admin portal migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          sql = Path('supabase/admin_portal.sql').read_text()
          Path('/tmp/admin-portal-query.json').write_text(json.dumps({'query': sql, 'read_only': False}))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/admin-portal-query.json
      - name: Deploy fixed import mahasiswa
        run: supabase functions deploy import-mahasiswa --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy seminar Drive upload
        run: supabase functions deploy upload-seminar-drive --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy admin user management
        run: supabase functions deploy admin-users --project-ref "$SUPABASE_PROJECT_REF"
      - name: Verify functions
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
