name: SIMASI Backend E2E Smoke (One Shot)

on:
  push:
    branches: [main]
    paths:
      - 'deploy/e2e-smoke-trigger.txt'

permissions:
  contents: read

concurrency:
  group: simasi-e2e-smoke
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: jdptpfpmelmaviucaioq
      SUPABASE_URL: https://jdptpfpmelmaviucaioq.supabase.co
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare isolated test identities
        shell: bash
        run: |
          set -euo pipefail
          E2E_TOKEN="$(openssl rand -hex 32)"
          ADMIN_PASSWORD="A9!$(openssl rand -hex 20)"
          NEW_STUDENT_PASSWORD="S9!$(openssl rand -hex 20)"
          TEST_NIM="T${GITHUB_RUN_ID}"
          ADMIN_EMAIL="e2e-admin-${GITHUB_RUN_ID}@students.simasi.local"
          echo "::add-mask::$E2E_TOKEN"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "::add-mask::$NEW_STUDENT_PASSWORD"
          {
            echo "E2E_TOKEN=$E2E_TOKEN"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "NEW_STUDENT_PASSWORD=$NEW_STUDENT_PASSWORD"
            echo "TEST_NIM=$TEST_NIM"
            echo "ADMIN_EMAIL=$ADMIN_EMAIL"
          } >> "$GITHUB_ENV"

      - name: Install Supabase CLI
        run: npm install --global supabase@latest

      - name: Deploy protected temporary E2E helper
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" SIMASI_E2E_TOKEN="$E2E_TOKEN"
          supabase functions deploy e2e-test-helper --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Create and sign in temporary admin
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python3 - <<PY
          import json, os
          print(json.dumps({'action':'create_admin','email':os.environ['ADMIN_EMAIL'],'password':os.environ['ADMIN_PASSWORD']}))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/e2e-test-helper" \
            -H "x-simasi-e2e-token: $E2E_TOKEN" -H 'content-type: application/json' \
            -d "$payload" > /tmp/admin.json
          ADMIN_TOKEN=$(jq -r '.access_token' /tmp/admin.json)
          ADMIN_USER_ID=$(jq -r '.user_id' /tmp/admin.json)
          PUBLIC_KEY=$(jq -r '.public_key' /tmp/admin.json)
          test -n "$ADMIN_TOKEN" && test "$ADMIN_TOKEN" != null
          echo "::add-mask::$ADMIN_TOKEN"
          echo "::add-mask::$PUBLIC_KEY"
          {
            echo "ADMIN_TOKEN=$ADMIN_TOKEN"
            echo "ADMIN_USER_ID=$ADMIN_USER_ID"
            echo "PUBLIC_KEY=$PUBLIC_KEY"
          } >> "$GITHUB_ENV"

      - name: Import one student through real import-mahasiswa function
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python3 - <<PY
          import json, os
          print(json.dumps({'students':[{'nim':os.environ['TEST_NIM'],'nama':'Mahasiswa Uji SIMASI','prodi':'Matematika'}]}))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/import-mahasiswa" \
            -H "Authorization: Bearer $ADMIN_TOKEN" -H "apikey: $PUBLIC_KEY" -H 'content-type: application/json' \
            -d "$payload" > /tmp/import.json
          test "$(jq -r '.ok' /tmp/import.json)" = true
          test "$(jq -r '.created' /tmp/import.json)" = 1

      - name: Login student with NIM as initial password
        shell: bash
        run: |
          set -euo pipefail
          STUDENT_EMAIL="$(echo "$TEST_NIM" | tr '[:upper:]' '[:lower:]')@students.simasi.local"
          payload=$(python3 - <<PY
          import json, os
          print(json.dumps({'action':'sign_in','email':os.environ['STUDENT_EMAIL'],'password':os.environ['TEST_NIM']}))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/e2e-test-helper" \
            -H "x-simasi-e2e-token: $E2E_TOKEN" -H 'content-type: application/json' \
            -d "$payload" > /tmp/student.json
          STUDENT_TOKEN=$(jq -r '.access_token' /tmp/student.json)
          STUDENT_USER_ID=$(jq -r '.user_id' /tmp/student.json)
          test -n "$STUDENT_TOKEN" && test "$STUDENT_TOKEN" != null
          echo "::add-mask::$STUDENT_TOKEN"
          {
            echo "STUDENT_EMAIL=$STUDENT_EMAIL"
            echo "STUDENT_TOKEN=$STUDENT_TOKEN"
            echo "STUDENT_USER_ID=$STUDENT_USER_ID"
          } >> "$GITHUB_ENV"

      - name: Force first password change through real function
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python3 - <<PY
          import json, os
          print(json.dumps({'new_password':os.environ['NEW_STUDENT_PASSWORD']}))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/change-initial-password" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -H "apikey: $PUBLIC_KEY" -H 'content-type: application/json' \
            -d "$payload" > /tmp/password.json
          test "$(jq -r '.ok' /tmp/password.json)" = true

      - name: Create seminar registration through PostgREST and RLS
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python3 - <<PY
          import json, os
          print(json.dumps({'user_id':os.environ['STUDENT_USER_ID'],'nim':os.environ['TEST_NIM'],'nama':'Mahasiswa Uji SIMASI','prodi':'Matematika','jenis_ujian':'Seminar Proposal','pas_foto_jumlah':2,'status':'diajukan'}))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/rest/v1/pendaftaran_seminar" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -H "apikey: $PUBLIC_KEY" -H 'content-type: application/json' -H 'Prefer: return=representation' \
            -d "$payload" > /tmp/registration.json
          REGISTRATION_ID=$(jq -r '.[0].id' /tmp/registration.json)
          test -n "$REGISTRATION_ID" && test "$REGISTRATION_ID" != null
          echo "REGISTRATION_ID=$REGISTRATION_ID" >> "$GITHUB_ENV"

      - name: Upload PDF through real Google Drive function
        shell: bash
        run: |
          set -euo pipefail
          printf '%%PDF-1.4\n%% SIMASI E2E smoke test\n1 0 obj << /Type /Catalog >> endobj\n%%%%EOF\n' > /tmp/simasi-e2e.pdf
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/functions/v1/upload-seminar-drive" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -H "apikey: $PUBLIC_KEY" \
            -F "file=@/tmp/simasi-e2e.pdf;type=application/pdf" \
            -F "nim=$TEST_NIM" -F 'nama=Mahasiswa Uji SIMASI' -F 'prodi=Matematika' \
            -F 'exam_type=Seminar Proposal' -F "registration_id=$REGISTRATION_ID" \
            -F 'document_key=e2e_smoke_test' -F 'document_label=Uji Backend SIMASI' > /tmp/upload.json
          test "$(jq -r '.ok' /tmp/upload.json)" = true
          DRIVE_FILE_ID=$(jq -r '.file_id' /tmp/upload.json)
          DRIVE_FOLDER_ID=$(jq -r '.folder_id' /tmp/upload.json)
          DRIVE_LINK=$(jq -r '.web_view_link' /tmp/upload.json)
          {
            echo "DRIVE_FILE_ID=$DRIVE_FILE_ID"
            echo "DRIVE_FOLDER_ID=$DRIVE_FOLDER_ID"
            echo "DRIVE_LINK=$DRIVE_LINK"
          } >> "$GITHUB_ENV"

      - name: Save Drive metadata through PostgREST and RLS
        shell: bash
        run: |
          set -euo pipefail
          payload=$(python3 - <<PY
          import json, os
          print(json.dumps({'pendaftaran_id':os.environ['REGISTRATION_ID'],'jenis_berkas':'e2e_smoke_test','nama_berkas':'SIMASI E2E Smoke Test.pdf','file_url':os.environ['DRIVE_LINK'],'status':'terunggah','storage_provider':'google_drive','drive_file_id':os.environ['DRIVE_FILE_ID'],'drive_folder_id':os.environ['DRIVE_FOLDER_ID']}))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -X POST "$SUPABASE_URL/rest/v1/berkas_seminar" \
            -H "Authorization: Bearer $STUDENT_TOKEN" -H "apikey: $PUBLIC_KEY" -H 'content-type: application/json' -H 'Prefer: return=representation' \
            -d "$payload" > /tmp/meta.json
          test "$(jq -r '.[0].storage_provider' /tmp/meta.json)" = google_drive

      - name: Verify database state through Management API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          nim=os.environ['TEST_NIM'].replace("'", "''")
          q=f"select count(*) as n from public.berkas_seminar b join public.pendaftaran_seminar p on p.id=b.pendaftaran_id where p.nim='{nim}' and b.storage_provider='google_drive' and b.drive_file_id is not null"
          open('/tmp/verify.json','w').write(json.dumps({'query':q,'read_only':True}))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'content-type: application/json' \
            --data-binary @/tmp/verify.json > /tmp/verify-result.json
          test "$(jq -r '.[0].n' /tmp/verify-result.json)" = 1
          echo "### SIMASI E2E Smoke Test — PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Import mahasiswa: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Login NIM / password awal NIM: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Wajib ganti password: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- RLS pendaftaran seminar: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- PDF → Google Drive: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Metadata Drive → database: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test NIM: $TEST_NIM" >> "$GITHUB_STEP_SUMMARY"
          echo "- Drive test file is intentionally retained for visual verification." >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup temporary Auth/database identities
        if: always()
        shell: bash
        run: |
          set +e
          payload=$(python3 - <<PY
          import json, os
          print(json.dumps({'action':'cleanup','admin_user_id':os.environ.get('ADMIN_USER_ID',''),'student_user_id':os.environ.get('STUDENT_USER_ID',''),'nim':os.environ.get('TEST_NIM','')}))
          PY
          )
          curl --silent --show-error -X POST "$SUPABASE_URL/functions/v1/e2e-test-helper" \
            -H "x-simasi-e2e-token: $E2E_TOKEN" -H 'content-type: application/json' -d "$payload" >/tmp/cleanup.json
          supabase secrets unset SIMASI_E2E_TOKEN --project-ref "$SUPABASE_PROJECT_REF" >/dev/null 2>&1 || true
          supabase functions delete e2e-test-helper --project-ref "$SUPABASE_PROJECT_REF" --yes >/dev/null 2>&1 || true
